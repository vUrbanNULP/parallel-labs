apiVersion: v1
kind: ConfigMap
metadata:
  name: logistics-config
data:
  ROUTES_DB_URL: jdbc:postgresql://postgres-service:5432/logistics_routes_db
  SHIPMENT_DB_URL: jdbc:postgresql://postgres-service:5432/logistics_shipment_db
  TRACKING_DB_URL: jdbc:postgresql://postgres-service:5432/logistics_tracking_db
  REDIS_HOST: redis-service
  REDIS_PORT: "6379"
  ROUTES_SERVICE_URL: http://routes-service:8081
  SHIPMENT_SERVICE_URL: http://shipment-service:8082
  TRACKING_SERVICE_URL: http://tracking-service:8083