server:
  port: 8082
spring:
  application:
    name: shipment-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

resilience4j:
  circuitbreaker:
    instances:
      trackingService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        registerHealthIndicator: true
      coreService:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15000ms
        registerHealthIndicator: true
  timelimiter:
    instances:
      trackingService:
        timeoutDuration: 2s